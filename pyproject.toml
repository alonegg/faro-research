[project]
name = "faro-research"
version = "0.1.0"
description = "Open-source A-share research agent — pluggable tools + multi-provider LLMs (DeepSeek / OpenAI / Anthropic / Moonshot)."
license = { text = "MIT" }
authors = [{ name = "Faro Research contributors" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["llm", "agent", "tushare", "a-share", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
faro-research = "faro_research.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/faro-research"
Issues = "https://github.com/your-org/faro-research/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faro_research"]

[tool.hatch.build.targets.wheel.force-include]
"faro_research/skills/builtin" = "faro_research/skills/builtin"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
