[project]
name = "faro-research"
version = "0.4.0"
description = "Open-source A-share research agent — pluggable tools + multi-provider LLMs (DeepSeek / OpenAI / Anthropic / Moonshot)."
license = { text = "MIT" }
authors = [{ name = "Faro Research contributors" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["llm", "agent", "tushare", "a-share", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
redis = [
    "redis>=5.0",
]
export = [
    "xhtml2pdf>=0.2.16",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
faro-research = "faro_research.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/faro-research"
Issues = "https://github.com/your-org/faro-research/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faro_research"]

# Include non-Python data files (SKILL.md workflows). Without this, hatch
# only ships .py files; SKILL.md would be missing from a `pip install` wheel
# and `discover_skills()` would return an empty list.
[tool.hatch.build]
include = [
  "faro_research/**/*.py",
  "faro_research/skills/builtin/**/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's idiomatic `Depends()` in defaults trips B008 — accepted convention.
"faro_research/server/app.py" = ["B008"]
