name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Python: import + unit-style smoke (no network, no LLM)
  # ────────────────────────────────────────────────────────────────────────
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps for [export] extra (xhtml2pdf → pycairo → libcairo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcairo2-dev libpango1.0-dev

      - name: Install package (server + export + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,export,dev]"

      - name: Ruff lint
        run: ruff check faro_research

      - name: Smoke imports + tool registry shape
        env:
          FARO_OPENAI_API_KEY: ci-stub
          FARO_PROVIDER: openai_compat
          TUSHARE_TOKEN: ci-stub
          FARO_DB_PATH: /tmp/faro-ci.db
        run: |
          python - <<'PY'
          from faro_research import Agent, Message, ToolRegistry, make_provider
          from faro_research.tools.builtin.tushare import tushare_tools, tushare_default_tools
          from faro_research.skills import discover_skills, make_skill_tool
          from faro_research.memory import MemoryStore, make_memory_tools
          from faro_research.audit import SessionStore

          # 1. Raw 5 Tushare tools register cleanly
          reg = ToolRegistry()
          reg.register_many(tushare_tools())
          assert reg.names() == [
              "resolve_ticker", "get_stock_quote", "get_key_ratios",
              "get_three_statements", "get_holder_trades",
          ]

          # 2. v0.2 default registry: meta + quote + skill + 3 memory tools
          p = make_provider()
          reg2 = ToolRegistry()
          reg2.register_many(tushare_default_tools(p))
          reg2.register(make_skill_tool())
          reg2.register_many(make_memory_tools(MemoryStore()))
          assert reg2.names() == [
              "get_company_data", "get_stock_quote", "skill",
              "memory_search", "memory_get", "memory_update",
          ], reg2.names()

          # 3. Skills discovery (SKILL.md files packaged)
          skills = {s.name for s in discover_skills()}
          assert skills == {"dcf-cn", "research-report", "screener"}, skills

          # 4. Memory roundtrip (SQLite + LIKE search)
          m = MemoryStore()
          m.append("long-term", "ci 测试条目")
          assert len(m.search("ci")) == 1
          assert len(m.search("测试")) == 1

          # 5. Agent constructs
          assert Agent(p, reg2).max_turns == 8

          # 6. Session store (with v0.4 user_id scoping)
          st = SessionStore()
          s = st.create_session(title="ci", user_id="default")
          st.append_message(s.id, "user", "hello")
          assert len(st.list_messages(s.id)) == 1
          # Foreign-user lookup must return None
          assert st.get_session(s.id, user_id="other") is None
          assert st.delete_session(s.id) is True

          # 7. v0.4 auth — UserStore + lookup
          from faro_research.auth import UserStore
          us = UserStore()
          default = us.get_default()
          assert default.id == "default"
          user, key = us.create_user(email="ci@test", role="user")
          assert key.startswith("fr-")
          assert us.lookup_by_key(key).id == user.id

          # 8. v0.4 export — markdown + PDF
          from faro_research.export import session_to_markdown, markdown_to_pdf
          from faro_research.audit.store import ChatSession, ChatMessage
          import datetime
          fake_s = ChatSession(id="s-x", user_id="default", title="ci report",
                               created_at=datetime.datetime.now(),
                               updated_at=datetime.datetime.now())
          fake_msgs = [
              ChatMessage(session_id="s-x", seq=0, role="user", content="test query"),
              ChatMessage(session_id="s-x", seq=1, role="assistant",
                          content="## answer\n\n| a | b |\n|---|---|\n| 1 | 2 |"),
          ]
          md = session_to_markdown(fake_s, fake_msgs)
          assert "ci report" in md and "test query" in md
          pdf = markdown_to_pdf(md, title="ci report")
          assert pdf[:5] == b"%PDF-", pdf[:20]
          assert len(pdf) > 1000

          print("smoke ok")
          PY

  # ────────────────────────────────────────────────────────────────────────
  # Docker: build both images, boot via compose, hit health endpoints
  # ────────────────────────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Write CI .env (no real secrets — agent calls won't be tested)
        run: |
          cat > .env <<'EOF'
          FARO_PROVIDER=openai_compat
          FARO_OPENAI_BASE_URL=https://api.deepseek.com
          FARO_OPENAI_API_KEY=ci-stub
          FARO_OPENAI_MODEL=deepseek-chat
          TUSHARE_TOKEN=ci-stub
          FARO_DB_PATH=/app/data/faro.db
          FARO_CORS_ORIGINS=http://localhost:5173
          EOF

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T backend python -c "import httpx; r = httpx.get('http://localhost:8000/api/health'); r.raise_for_status(); print(r.json())" 2>/dev/null; then
              echo "backend healthy"
              exit 0
            fi
            echo "waiting... ($i)"
            sleep 2
          done
          echo "backend never healthy"
          docker compose logs backend
          exit 1

      - name: Verify /api/tools exposes the v0.2 default registry
        run: |
          docker compose exec -T backend python - <<'PY'
          import httpx
          tools = httpx.get("http://localhost:8000/api/tools").json()
          names = [t["name"] for t in tools]
          for must in ("get_company_data", "get_stock_quote", "skill",
                       "memory_search", "memory_get", "memory_update"):
              assert must in names, (must, names)
          assert len(tools) == 6, f"expected 6 tools, got {len(tools)}: {names}"
          print("tools ok:", names)
          PY

      - name: Verify session create + list
        run: |
          docker compose exec -T backend python - <<'PY'
          import httpx
          base = "http://localhost:8000/api"
          s = httpx.post(f"{base}/sessions", json={"title": "ci"}).json()
          assert s["id"].startswith("s-"), s
          all_ = httpx.get(f"{base}/sessions").json()
          assert any(x["id"] == s["id"] for x in all_)
          httpx.delete(f"{base}/sessions/{s['id']}").raise_for_status()
          print("sessions ok")
          PY

      - name: Verify web container serves UI shell
        run: |
          # web container exposes port 80; compose maps to 5173 on host
          curl -fsS http://localhost:5173/ | grep -q "Faro Research" && echo "ui ok"

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
